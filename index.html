<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XYZ Email Verifier</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;padding:24px;
      display:flex;align-items:center;justify-content:center;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#fff;background:#080808;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:32px 32px;
    }
    .card{
      width:100%;max-width:560px;padding:28px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;background:rgba(18,18,18,.82);
      backdrop-filter:blur(18px);
      box-shadow:0 24px 80px rgba(0,0,0,.5);
    }
    .badge{
      display:inline-flex;padding:7px 11px;border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);font-size:12px;color:#bbb;
    }
    h1{margin:16px 0 7px;font-size:30px}
    .sub{margin:0 0 24px;color:#999;font-size:14px}
    label{display:block;margin:0 0 8px;font-size:13px;color:#ccc}
    input{
      width:100%;height:50px;padding:0 15px;margin-bottom:16px;
      color:#fff;background:#0d0d0d;border:1px solid #292929;
      border-radius:13px;outline:none;font-size:14px;
    }
    input:focus{border-color:#777;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:3px}
    button{
      height:50px;border:0;border-radius:13px;cursor:pointer;
      color:#050505;background:#fff;font-weight:700;font-size:14px;
      transition:.18s transform,.18s opacity;
    }
    button.secondary{color:#fff;background:#222;border:1px solid #333}
    button:hover{transform:translateY(-1px)}
    button:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .status{
      margin-top:18px;padding:14px;border-radius:13px;
      border:1px solid #242424;background:#0b0b0b;
      white-space:pre-wrap;word-break:break-word;
      font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
      color:#bbb;display:none;max-height:260px;overflow:auto;
    }
    .status.show{display:block}
    .hint{margin-top:15px;color:#666;font-size:11px;text-align:center}
    @media(max-width:480px){
      body{padding:14px}.card{padding:21px}.buttons{grid-template-columns:1fr}
      h1{font-size:26px}
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">XYZ EMAIL VERIFIER · v1.0.1</span>
    <h1>Email Verification</h1>
    <p class="sub">Kirim email verifikasi lalu masukkan link dan order ID untuk proses verifikasi.</p>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="user@example.com" autocomplete="email">

    <label for="link">Link Verifikasi</label>
    <input id="link" type="url" placeholder="https://example.com/verify">

    <label for="orderid">Order ID</label>
    <input id="orderid" type="text" placeholder="XVoid-123456">

    <div class="buttons">
      <button id="sendBtn" onclick="sendEmail()">Send Email</button>
      <button id="verifyBtn" class="secondary" onclick="verifyLink()">Verify Link</button>
    </div>

    <div id="status" class="status"></div>
    <div class="hint">Powered by XYZ API</div>
  </main>

<script>
const $ = id => document.getElementById(id);

function showStatus(value) {
  const box = $("status");
  box.textContent = typeof value === "string"
    ? value
    : JSON.stringify(value, null, 2);
  box.classList.add("show");
}

async function callApi(params) {
  const query = new URLSearchParams(params);
  const response = await fetch("/api?" + query.toString());
  const text = await response.text();

  let data;
  try { data = JSON.parse(text); }
  catch { data = { status: response.ok, response: text }; }

  if (!response.ok) throw new Error(JSON.stringify(data, null, 2));
  return data;
}

async function sendEmail() {
  const email = $("email").value.trim();

  if (!email) {
    showStatus("Email wajib diisi.");
    return;
  }

  const btn = $("sendBtn");
  btn.disabled = true;
  btn.textContent = "Sending...";

  try {
    const data = await callApi({ action:"send", email });
    showStatus(data);
  } catch (e) {
    showStatus("ERROR\n" + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Send Email";
  }
}

async function verifyLink() {
  const email = $("email").value.trim();
  const link = $("link").value.trim();
  const orderid = $("orderid").value.trim();

  if (!email || !link || !orderid) {
    showStatus("Email, Link Verifikasi, dan Order ID wajib diisi.");
    return;
  }

  const btn = $("verifyBtn");
  btn.disabled = true;
  btn.textContent = "Verifying...";

  try {
    const data = await callApi({
      action:"verif",
      email,
      link,
      orderid
    });
    showStatus(data);
  } catch (e) {
    showStatus("ERROR\n" + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Verify Link";
  }
}
</script>
</body>
</html>
